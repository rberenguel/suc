<!doctype html>
<html>
  <head>
    <title>Suc: Activity Data</title>
    <script src="lib/d3.v7.min.js"></script>
    <link rel="stylesheet" href="data.css" />
  </head>
  <body>
    <h1>Activity Data</h1>
    <div id="controls">
      <div id="date-selector-container" class="custom-select">
        <button id="date-selector-button">Select Dates</button>
        <div
          id="date-selector-options"
          class="custom-select-options"
          style="display: none"
        >
          <!-- Dates will be populated here -->
        </div>
      </div>
      <button id="toggleData">Show Raw Data</button>
      <button id="saveData" style="display: none">Save Data</button>
      <span id="status-notice"></span>
      <button id="exportDay">Export Day</button>
      <button id="exportSelected">Export Selected</button>
      <button id="exportAll">Export All</button>
    </div>

    <div id="data-container" style="display: none">
      <textarea id="productivity-data"></textarea>
    </div>

    <hr />
    <h2>Theme Editor</h2>
    <details>
      <summary style="cursor: pointer; color: #268bd2"></summary>
      <div id="theme-editor">
        <p>
          Assign a theme to a URL for this day. Leave empty for default
          grouping.
        </p>
        <div id="theme-list"></div>
        <datalist id="theme-suggestions"></datalist>
        <br />
        <button id="saveThemes">Save Themes</button>
        <span id="theme-status" style="color: #859900; margin-left: 1em"></span>
      </div>
    </details>

    <hr />

    <h2>Daily Summary</h2>
    <div id="duration-summary"></div>

    <h1>Activity Swimlane</h1>
    <div id="chart-container"></div>
    <div id="tooltip"></div>

    <script type="module" src="data.js"></script>
  </body>
</html>
